    /*Styling for screen-size file dropzone*/
    body {
      padding: 0;
      margin: 0;
    }

    #songUploadFileReader {
      position: absolute;
      top: 20px;
      left: 50%;
    }

    .drop-zone {
      width: 100vw;
      height: 100vh;
      opacity: 0%;
      position: absolute;
      background-color: white;
    }

    .drop-zone-input {
      display: none;

      opacity: 50%;
    }
  </style>
